[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldassist"
version = "1.4.0"
description = "Service-manual question answering on OpenShift AI: KServe/vLLM serving, hybrid retrieval, golden-set promotion gate"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Kurinets" }]
dependencies = [
    "fastapi==0.120.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.12",
    "psycopg-pool==3.2.7",
    "pyyaml==6.0.3",
    "prometheus-client==0.23.1",
]

[project.optional-dependencies]
pipelines = ["kfp==2.18.0", "kfp-kubernetes==2.18.0"]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
fieldassist = "fieldassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldassist = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
