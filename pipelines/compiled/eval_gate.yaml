            - envVar: FA_DATABASE_URL
              secretKey: url
            optional: false
            secretName: fieldassist-db
            secretNameParameter:
              runtimeValue:
                constant: fieldassist-db
          - keyToEnv:
            - envVar: FA_MODEL_TOKEN
              secretKey: token
            optional: false
            secretName: fieldassist-model-token
            secretNameParameter:
              runtimeValue:
                constant: fieldassist-model-token
        exec-gate:
          secretAsEnv:
          - keyToEnv:
            - envVar: FA_DATABASE_URL
              secretKey: url
            optional: false
            secretName: fieldassist-db
            secretNameParameter:
              runtimeValue:
                constant: fieldassist-db
          - keyToEnv:
            - envVar: FA_MODEL_TOKEN
              secretKey: token
            optional: false
            secretName: fieldassist-model-token
            secretNameParameter:
              runtimeValue:
                constant: fieldassist-model-token
        exec-promote:
          secretAsEnv:
          - keyToEnv:
            - envVar: FA_DATABASE_URL
              secretKey: url
            optional: false
            secretName: fieldassist-db
            secretNameParameter:
              runtimeValue:
                constant: fieldassist-db
          - keyToEnv:
