name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  KUSTOMIZE_VERSION: v5.4.3
  KUBECONFORM_VERSION: v0.7.0

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fieldassist
          POSTGRES_PASSWORD: fieldassist
          POSTGRES_DB: fieldassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldassist" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fieldassist:fieldassist@localhost:5432/fieldassist_test
      REQUIRE_KUSTOMIZE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - run: pip install -e ".[dev,pipelines]"
      - run: ruff check src pipelines tests
      - run: python pipelines/compile.py --check
      - run: pytest -p no:warnings

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Render and validate (CRD schemas from the datreeio catalog)
        # Route and DataSciencePipelinesApplication have no published schema; they are skipped by name so
        # that any other kind without a schema still fails.
        run: |
          mkdir -p rendered
          kustomize build deploy/overlays/prod > rendered/prod.yaml
          kustomize build deploy/overlays/dev > rendered/dev.yaml
          kustomize build deploy/cluster > rendered/cluster.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -skip Route,DataSciencePipelinesApplication \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml deploy/argocd/applications.yaml

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color | tail -n 200
      - if: always()
        run: docker compose down -v
